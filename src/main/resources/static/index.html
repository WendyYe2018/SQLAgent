<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>SQL Agent</title>
    <style>
       * {
           box-sizing: border-box;
       }

       body {
           margin: 0;
           font-family: "Microsoft YaHei", Arial, sans-serif;
           background: linear-gradient(135deg, #f4f7fb 0%, #eef4ff 100%);
           color: #1f2937;
       }

       .app {
           max-width: 1200px;
           margin: 32px auto;
           padding: 24px;
        }

       .header {
           display: flex;
           align-items: center;
           justify-content: space-between;
           margin-bottom: 20px;
       }

       .header h2 {
           margin: 0;
           font-size: 32px;
        }

       .badge {
           background: #e0ecff;
           color: #2a5bd7;
           border-radius: 999px;
           padding: 8px 14px;
           font-size: 12px;
           font-weight: bold;
       }

       .layout {
           display: grid;
           grid-template-columns: 1fr 320px;
           gap: 24px;
           align-items: start;
       }

       .panel {
           background: rgba(255, 255, 255, 0.85);
           border: 1px solid #e5e7eb;
           border-radius: 18px;
           box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
           padding: 20px;
       }

       .examples-title {
           margin: 0 0 16px 0;
           font-size: 18px;
       }

       .example-list {
           display: flex;
           flex-direction: column;
           gap: 10px;
       }

       .example-header {
           display: flex;
           justify-content: space-between;
           align-items: center;
           gap: 12px;
           margin-bottom: 12px;
       }

       .refresh-btn {
           border: 1px solid #dbeafe;
           background: #eff6ff;
           color: #2563eb;
           border-radius: 10px;
           padding: 8px 12px;
           cursor: pointer;
           font-size: 12px;
           font-weight: bold;
       }

       .example-btn {
           width: 100%;
           border: 1px solid #dbeafe;
           background: #f8fbff;
           text-align: left;
           padding: 12px 14px;
           border-radius: 12px;
           cursor: pointer;
           color: #1f2937;
           font-size: 14px;
           transition: all 0.2s ease;
       }

       .example-btn:hover {
           background: #edf5ff;
           transform: translateY(-1px);
           border-color: #bfdbfe;
       }

       .main {
           display: flex;
           flex-direction: column;
           gap: 20px;
       }

       textarea {
           width: 100%;
           border: 1px solid #d1d5db;
           border-radius: 14px;
           padding: 14px 16px;
           font-size: 15px;
           resize: vertical;
           background: #fff;
           outline: none;
       }

       textarea:focus {
           border-color: #60a5fa;
           box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.15);
       }

       #question {
           min-height: 100px;
       }

       .actions {
           display: flex;
           gap: 12px;
           align-items: center;
       }

       button.primary {
           background: linear-gradient(135deg, #2563eb, #3b82f6);
           color: white;
           border: none;
           border-radius: 12px;
           padding: 12px 22px;
           font-size: 15px;
           font-weight: bold;
           cursor: pointer;
           box-shadow: 0 8px 16px rgba(37, 99, 235, 0.2);
       }

       .result-box {
           background: #f8fafc;
           border: 1px solid #e2e8f0;
           border-radius: 14px;
           padding: 18px;
           min-height: 90px;
           white-space: pre-wrap;
           line-height: 1.7;
       }

       .sub-title {
           margin: 0 0 12px;
           font-size: 18px;
       }

       #sql {
           min-height: 180px;
           background: #0f172a;
           color: #e2e8f0;
           border: none;
           font-family: Consolas, monospace;
       }

       table {
           width: 100%;
           border-collapse: collapse;
           background: white;
           border-radius: 12px;
           overflow: hidden;
       }

       th {
           background: #f3f4f6;
           font-weight: bold;
       }

       th, td {
           border: 1px solid #e5e7eb;
           padding: 12px 10px;
           text-align: left;
           font-size: 14px;
       }

       tr:nth-child(even) td {
           background: #fafafa;
       }

       .empty {
           color: #6b7280;
           font-size: 14px;
       }

       @media (max-width: 900px) {
           .layout {
               grid-template-columns: 1fr;
           }
       }
    </style>
</head>

<body>
    <div class="app">
       <div class="header">
           <h2>🤖 SQL Agent</h2>
           <span class="badge">AI 数据助手</span>
       </div>

       <div class="layout">
           <main class="main">
               <div class="panel">
                   <textarea id="question" placeholder="请输入问题，例如：统计最近30天的订单总数"></textarea>
                   <div class="actions">
                       <button class="primary" onclick="ask()">发送</button>
                   </div>
               </div>

               <div class="panel">
                   <h3 class="sub-title">🤖 Agent回答</h3>
                   <div id="answer" class="result-box">等待查询...</div>
               </div>

               <div class="panel">
                   <h3 class="sub-title">SQL</h3>
                   <textarea id="sql" readonly></textarea>
               </div>

               <div class="panel">
                   <h3 class="sub-title">📊 查询结果</h3>
                   <div id="table-result" class="empty">暂无数据</div>
               </div>
           </main>

           <aside class="panel">
               <div class="example-header">
                   <h3 class="examples-title">💡 推荐问题</h3>
                   <button class="refresh-btn" onclick="loadExamples(true)">换一批</button>
               </div>
               <div id="examples" class="example-list">加载中...</div>
           </aside>
       </div>
    </div>

    <script>
       const elements = {
           question: document.getElementById('question'),
           answer: document.getElementById('answer'),
           sql: document.getElementById('sql'),
           tableResult: document.getElementById('table-result'),
           examples: document.getElementById('examples')
       };

       function setEmptyTable() {
           elements.tableResult.innerHTML = '<div class="empty">暂无数据</div>';
       }

       function setAnswer(text) {
           elements.answer.innerText = text;
       }

       function setSql(text) {
           elements.sql.value = text || '';
       }

       function fillQuestion(value) {
           elements.question.value = value;
       }

       function renderTable(rows) {
           if (!rows || rows.length === 0) {
               setEmptyTable();
               return;
           }

           const keys = Object.keys(rows[0]);
           let html = '<table><thead><tr>';

           keys.forEach(key => {
               html += `<th>${key}</th>`;
           });

           html += '</tr></thead><tbody>';

           rows.forEach(row => {
               html += '<tr>';
               keys.forEach(key => {
                   const value = row[key] == null ? '' : row[key];
                   html += `<td>${value}</td>`;
               });
               html += '</tr>';
           });

           html += '</tbody></table>';
           elements.tableResult.innerHTML = html;
       }

       async function loadExamples(forceRefresh = false) {
           elements.examples.innerHTML = '<div class="empty">加载中...</div>';

           try {
               const url = forceRefresh ? '/api/examples?refresh=true' : '/api/examples';
               const response = await fetch(url);
               const list = await response.json();

               if (!list || list.length === 0) {
                   elements.examples.innerHTML = '<div class="empty">暂无推荐问题</div>';
                   return;
               }

               elements.examples.innerHTML = list
                   .map(item => {
                       const safeItem = item.replace(/'/g, "\\'");
                       return `
                           <button class="example-btn" onclick="fillQuestion('${safeItem}')">
                               ${item}
                           </button>
                       `;
                   })
                   .join('');
           } catch (error) {
               elements.examples.innerHTML = '<div class="empty">推荐问题加载失败</div>';
           }
       }

       function handleNeedsClarification(data) {
           const sqlText = data.lastAttemptSql || data.sql || '';

           setSql(sqlText);
           setAnswer(data.clarificationQuestion || '我已经尝试了 3 次 SQL，但仍需要您确认业务定义。');
           setEmptyTable();
       }

       function handleError(data) {
           setAnswer('❌ ' + (data.error || '查询失败'));
           setEmptyTable();
       }

       async function ask() {
           const question = elements.question.value.trim();
           if (!question) {
               setAnswer('请输入查询问题');
               return;
           }

           try {
               const response = await fetch('/api/query', {
                   method: 'POST',
                   headers: {
                       'Content-Type': 'application/json'
                   },
                   body: JSON.stringify({ question })
               });

               const data = await response.json();

               if (data.status === 'needs_clarification') {
                   handleNeedsClarification(data);
                   return;
               }

               setSql(data.sql || '');

               if (data.error) {
                   handleError(data);
                   return;
               }

               setAnswer(data.answer || '');
               renderTable(data.data || []);
           } catch (error) {
               setAnswer('❌ 请求失败，请稍后再试');
               setEmptyTable();
           }
       }

       window.onload = () => loadExamples();
    </script>
</body>

</html>
